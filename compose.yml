networks:
  Automation:
    name: Automation
    driver: bridge

services:
  # ==========================================
  # 1. PostgreSQL Database
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./shared:/data/shared
    networks:
      - Automation
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h localhost -U ${POSTGRES_USER} -d ${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ==========================================
  # 2. Redis Cache & Key-Value Store
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - ./data/redis:/data
      - ./shared:/data/shared
    networks:
      - Automation
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================
  # 2b. Redis Insight UI
  # ==========================================
  redisinsight:
    image: redis/redisinsight:latest
    container_name: redisinsight
    restart: unless-stopped
    ports:
      - "5540:5540"
    volumes:
      - ./data/redisinsight:/data
      - ./shared:/data/shared
    networks:
      - Automation
    depends_on:
      redis:
        condition: service_healthy

  # ==========================================
  # 3. Ollama Core Engine
  # ==========================================
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    environment:
      - OLLAMA_MODELS=/root/.ollama/models
    volumes:
      - ./data/ollama/models:/root/.ollama/models
      - ./shared:/data/shared
    networks:
      - Automation
    entrypoint: >
      sh -c "/bin/ollama serve & 
             pid=$$!; 
             sleep 5; 
             ollama pull qwen2.5-coder:3b; 
             ollama pull nomic-embed-text; 
             wait $$pid"

  # ==========================================
  # 4. n8n Main Automation Service
  # ==========================================
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_LISTEN_ADDRESS=0.0.0.0
      - N8N_HOST=n8n.local
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_SECURE_COOKIE=false
      - NODE_ENV=production
      - WEBHOOK_URL=http://n8n.local/
      - N8N_WEBHOOK_URL=http://n8n.local/
      - GENERIC_TIMEZONE=Asia/Kolkata
      - N8N_RUNNERS_TASK_TIMEOUT=300

      # Database Connection
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB}
      - DB_POSTGRESDB_USER=${POSTGRES_USER}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      - NODES_EXCLUDE=[]
      - N8N_UNVERIFIED_PACKAGES_ENABLED=true
      - N8N_COMPRESSION_NODE_MAX_DECOMPRESSED_SIZE_BYTES=2147483648
      - N8N_COMPRESSION_NODE_MAX_ZIP_ENTRIES=5000

      # Official External Task Runner Broker Setup
      - N8N_RUNNERS_ENABLED=true
      - N8N_RUNNERS_MODE=external
      - N8N_RUNNERS_BROKER_PORT=5679
      - N8N_RUNNERS_BROKER_LISTEN_ADDRESS=0.0.0.0
      - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN}
      - N8N_NATIVE_PYTHON_RUNNER=true

      # n8n Assistant & Sandbox Integration
      - N8N_ENABLED_MODULES=instance-ai
      - N8N_INSTANCE_AI_SANDBOX_ENABLED=true
      - N8N_INSTANCE_AI_SANDBOX_PROVIDER=n8n-sandbox
      - N8N_SANDBOX_SERVICE_URL=http://sandbox-api:8080
      - N8N_SANDBOX_SERVICE_API_KEY=${N8N_SANDBOX_SERVICE_API_KEY}
      - N8N_INSTANCE_AI_SEARXNG_URL=http://searxng:8080
    volumes:
      - ./data/n8n/.n8n:/home/node/.n8n
      - ./shared:/data/shared
    networks:
      - Automation
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
      sandbox-api:
        condition: service_healthy

  # ==========================================
  # 5. Dedicated n8n External Task Runner
  # ==========================================
  task-runners:
    build:
      context: ./services/runner
      dockerfile: Dockerfile
    container_name: n8n-runners
    restart: unless-stopped
    environment:
      - N8N_RUNNERS_TASK_BROKER_URI=http://n8n:5679
      - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN}
      - N8N_RUNNERS_LAUNCHER_LOG_LEVEL=debug
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - ./shared:/data/shared
    networks:
      - Automation
    depends_on:
      - n8n

  # ==========================================
  # 6. Qdrant Vector Database
  # ==========================================
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    environment:
      - QDRANT_API_KEY=${QDRANT_API_KEY}
    volumes:
      - ./data/qdrant:/qdrant/storage
      - ./shared:/data/shared
    networks:
      - Automation

  # ==========================================
  # 7. SearXNG Meta Search Engine
  # ==========================================
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    environment:
      - SEARXNG_BASE_URL=${SEARXNG_BASE_URL}
    volumes:
      - ./data/searxng:/etc/searxng
      - ./shared:/data/shared
    networks:
      - Automation

  # ==========================================
  # 8. Crawl4AI Web Crawler
  # ==========================================
  crawl4ai:
    image: unclecode/crawl4ai:latest
    container_name: crawl4ai
    restart: unless-stopped
    environment:
      - CRAWL4AI_API_TOKEN=${CRAWL4AI_API_TOKEN:-${CRAWL4AI_API_KEY}}
    ports:
      - "11235:11235"
    shm_size: 1gb
    volumes:
      - ./shared:/data/shared
    networks:
      - Automation

  # ==========================================
  # 9. Docling Document Processing
  # ==========================================
  docling:
    image: quay.io/docling-project/docling-serve:latest
    container_name: docling
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - DOCLING_SERVE_ENABLE_UI=true
      - DOCLING_SERVE_API_KEY=${DOCLING_API_KEY}
    volumes:
      - ./shared:/data/shared
    networks:
      - Automation

  # ==========================================
  # 10. Neo4j Graph Database
  # ==========================================
  neo4j:
    image: neo4j:5-community
    container_name: neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD}
      - NEO4J_server_default__listen__address=0.0.0.0
      - NEO4J_server_bolt_advertised__address=neo.local:7687
    volumes:
      - ./data/neo4j:/data
      - ./shared:/data/shared
    networks:
      - Automation

  # ==========================================
  # 11. Caddy Reverse Proxy and Shared Files
  # ==========================================
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./portal:/srv/portal:ro
      - ./shared:/srv/shared
      - ./data/caddy/data:/data
      - ./data/caddy/config:/config
    networks:
      Automation:
        aliases:
          - n8n.local
          - hub.local
          - portal.local
          - openwa.local
          - wa.local
          - redis.local
          - search.local
          - searxng.local
          - docling.local
          - ollama.local
          - qdrant.local
          - crawl.local
          - crawl4ai.local
          - neo.local
          - neo4j.local
          - files.local
          - sandbox.local
          - supabase.local
          - api.supabase.local
    depends_on:
      - n8n
      - automation-manager
      - ollama
      - qdrant
      - searxng
      - crawl4ai
      - docling
      - neo4j
      - redisinsight
      - sandbox-api
      - supabase-studio
      - supabase-kong
      - openwa

  # ==========================================
  # 12. n8n Assistant Sandbox TLS Init
  # ==========================================
  sandbox-certs:
    image: ghcr.io/n8n-io/n8n-sandbox-service-api:${N8N_SANDBOX_VERSION:-1.9.0}
    container_name: sandbox-certs
    user: "0:0"
    entrypoint:
      - /bin/sh
      - -c
      - >-
        bootstrap-mtls.sh --out-dir /tls --api-san sandbox-api --control-san-prefix sandbox-runner --world-readable
        && chown -R sandbox-api:sandbox-api /tls/api
        && chmod -R a+rX /tls
    restart: "no"
    volumes:
      - sandbox-tls:/tls
    networks:
      - Automation

  # ==========================================
  # 13. n8n Assistant Sandbox Control Plane API
  # ==========================================
  sandbox-api:
    image: ghcr.io/n8n-io/n8n-sandbox-service-api:${N8N_SANDBOX_VERSION:-1.9.0}
    container_name: sandbox-api
    restart: unless-stopped
    ports:
      - "5681:8080"
    environment:
      - SANDBOX_API_KEYS=${SANDBOX_API_KEYS}
      - SANDBOX_API_RUNNER_API_KEY=${SANDBOX_API_RUNNER_API_KEY}
      - SANDBOX_API_RUNNER_REGISTRATION_TOKEN=${SANDBOX_API_RUNNER_REGISTRATION_TOKEN}
      - SANDBOX_API_GRPC_TLS_CERT_FILE=/tls/api/grpc-server.crt
      - SANDBOX_API_GRPC_TLS_KEY_FILE=/tls/api/grpc-server.key
      - SANDBOX_API_GRPC_TLS_CLIENT_CA_FILE=/tls/api/ca.crt
      - SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_CERT_FILE=/tls/api/control-grpc-api-client.crt
      - SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_KEY_FILE=/tls/api/control-grpc-api-client.key
      - SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_CA_FILE=/tls/api/ca.crt
      - SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_SERVER_NAME=sandbox-runner-1
    volumes:
      - sandbox-tls:/tls:ro
    networks:
      - Automation
    depends_on:
      sandbox-certs:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # ==========================================
  # 14. n8n Assistant Sandbox Runner (DinD)
  # ==========================================
  sandbox-runner-1:
    image: ghcr.io/n8n-io/n8n-sandbox-service-runner-dind:${N8N_SANDBOX_VERSION:-1.9.0}
    container_name: sandbox-runner-1
    restart: unless-stopped
    privileged: true
    environment:
      - SANDBOX_RUNNER_API_KEYS=${SANDBOX_API_RUNNER_API_KEY}
      - SANDBOX_RUNNER_REGISTRATION_TOKEN=${SANDBOX_API_RUNNER_REGISTRATION_TOKEN}
      - SANDBOX_RUNNER_API_GRPC_ADDR=sandbox-api:9090
      - SANDBOX_RUNNER_HTTP_BASE_URL=https://sandbox-runner-1:8080
      - SANDBOX_RUNNER_REGISTRATION_GRPC_CA_FILE=/tls/runner/ca.crt
      - SANDBOX_RUNNER_REGISTRATION_GRPC_CERT_FILE=/tls/runner/grpc-client.crt
      - SANDBOX_RUNNER_REGISTRATION_GRPC_KEY_FILE=/tls/runner/grpc-client.key
      - SANDBOX_RUNNER_REGISTRATION_GRPC_SERVER_NAME=sandbox-api
      - SANDBOX_RUNNER_CONTROL_GRPC_TLS_CLIENT_CA_FILE=/tls/runner/ca.crt
      - SANDBOX_RUNNER_CONTROL_GRPC_TLS_CERT_FILE=/tls/runner/control-grpc-server.crt
      - SANDBOX_RUNNER_CONTROL_GRPC_TLS_KEY_FILE=/tls/runner/control-grpc-server.key
      - SANDBOX_RUNNER_CONTROL_GRPC_ADVERTISE_ADDR=sandbox-runner-1:9091
      - SANDBOX_RUNNER_DOCKER_SANDBOX_IMAGE=ghcr.io/n8n-io/n8n-sandbox-service-sandbox:${N8N_SANDBOX_VERSION:-1.9.0}
    volumes:
      - sandbox-tls:/tls:ro
    networks:
      - Automation
    depends_on:
      sandbox-api:
        condition: service_healthy

  # ==========================================
  # 15. Automation Control Plane Manager
  # ==========================================
  automation-manager:
    build:
      context: ./services/manager
    container_name: automation-manager
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./.env:/app/.env:ro
      - ./docs:/app/docs:ro
    networks:
      - Automation
    environment:
      - PORT=3005
      - OLLAMA_HOST=ollama
      - OLLAMA_PORT=11434

  # ==========================================
  # 16. Supabase Database (PostgreSQL 17 + pgvector + Supabase Extensions)
  # ==========================================
  supabase-db:
    image: supabase/postgres:17.6.1.136
    container_name: supabase-db
    restart: unless-stopped
    ports:
      - "54322:5432"
    volumes:
      - ./config/supabase/db/realtime.sql:/docker-entrypoint-initdb.d/migrations/99-realtime.sql:ro
      - ./config/supabase/db/webhooks.sql:/docker-entrypoint-initdb.d/init-scripts/98-webhooks.sql:ro
      - ./config/supabase/db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
      - ./config/supabase/db/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:ro
      - ./config/supabase/db/_supabase.sql:/docker-entrypoint-initdb.d/migrations/97-_supabase.sql:ro
      - ./config/supabase/db/logs.sql:/docker-entrypoint-initdb.d/migrations/99-logs.sql:ro
      - ./config/supabase/db/pooler.sql:/docker-entrypoint-initdb.d/migrations/99-pooler.sql:ro
      - ./data/supabase/db:/var/lib/postgresql/data
      - supabase-db-config:/etc/postgresql-custom
    networks:
      Automation:
        aliases:
          - db
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: 5432
      POSTGRES_PORT: 5432
      PGPASSWORD: ${SUPABASE_DB_PASSWORD}
      POSTGRES_PASSWORD: ${SUPABASE_DB_PASSWORD}
      PGDATABASE: postgres
      POSTGRES_DB: postgres
      POSTGRES_USER: supabase_admin
      JWT_EXP: ${SUPABASE_JWT_EXPIRY:-3600}
    command:
      [
        "postgres",
        "-c",
        "config_file=/etc/postgresql/postgresql.conf",
        "-c",
        "log_min_messages=fatal"
      ]

  # ==========================================
  # 16. Supabase Kong API Gateway
  # ==========================================
  supabase-kong:
    image: kong/kong:3.9.3
    container_name: supabase-kong
    restart: unless-stopped
    ports:
      - "54321:8000"
      - "54324:8443"
    volumes:
      - ./config/supabase/api/kong.yml:/home/kong/temp.yml:ro
      - ./config/supabase/api/kong-entrypoint.sh:/home/kong/kong-entrypoint.sh:ro
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/kong.yml
      KONG_ROUTER_FLAVOR: expressions
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_DNS_NOT_FOUND_TTL: 1
      KONG_DNS_VALID_TTL: 5
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,basic-auth,request-termination,ip-restriction,post-function
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
      KONG_PROXY_ACCESS_LOG: /dev/stdout combined
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
      ANON_KEY_ASYMMETRIC: ${SUPABASE_ANON_KEY_ASYMMETRIC:-}
      SERVICE_ROLE_KEY_ASYMMETRIC: ${SUPABASE_SERVICE_ROLE_KEY_ASYMMETRIC:-}
      DASHBOARD_USERNAME: ${SUPABASE_DASHBOARD_USERNAME:-supabase}
      DASHBOARD_PASSWORD: ${SUPABASE_DASHBOARD_PASSWORD}
    entrypoint: ["/bin/sh", "/home/kong/kong-entrypoint.sh"]
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      supabase-studio:
        condition: service_healthy
    networks:
      Automation:
        aliases:
          - kong
          - api-gw

  # ==========================================
  # 17. Supabase GoTrue Auth Service
  # ==========================================
  supabase-auth:
    image: supabase/gotrue:v2.197.0
    container_name: supabase-auth
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:9999/health"
        ]
      timeout: 5s
      interval: 5s
      retries: 5
      start_period: 10s
    depends_on:
      supabase-db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${SUPABASE_PUBLIC_URL}/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${SUPABASE_DB_PASSWORD}@db:5432/postgres
      GOTRUE_SITE_URL: ${SUPABASE_PUBLIC_URL}
      GOTRUE_URI_ALLOW_LIST: "*"
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${SUPABASE_JWT_EXPIRY:-3600}
      GOTRUE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      GOTRUE_JWT_ISSUER: ${SUPABASE_PUBLIC_URL}/auth/v1
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_SMTP_ADMIN_EMAIL: admin@example.com
      GOTRUE_SMTP_HOST: localhost
      GOTRUE_SMTP_PORT: 2500
    networks:
      Automation:
        aliases:
          - auth

  # ==========================================
  # 18. Supabase PostgREST API Service
  # ==========================================
  supabase-rest:
    image: postgrest/postgrest:v14.18
    container_name: supabase-rest
    restart: unless-stopped
    depends_on:
      supabase-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "postgrest", "--ready"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      PGRST_DB_URI: postgres://authenticator:${SUPABASE_DB_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public,storage,graphql_public
      PGRST_DB_MAX_ROWS: 1000
      PGRST_DB_EXTRA_SEARCH_PATH: public,extensions
      PGRST_DB_ANON_ROLE: anon
      PGRST_ADMIN_SERVER_PORT: 3001
      PGRST_ADMIN_SERVER_HOST: 0.0.0.0
      PGRST_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_EXP: ${SUPABASE_JWT_EXPIRY:-3600}
    command: ["postgrest"]
    networks:
      Automation:
        aliases:
          - rest

  # ==========================================
  # 19. Supabase Realtime Service
  # ==========================================
  supabase-realtime:
    image: supabase/realtime:v2.143.3
    container_name: realtime-dev.supabase-realtime
    restart: unless-stopped
    depends_on:
      supabase-db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sSfL --head -o /dev/null http://127.0.0.1:4000/"
        ]
      timeout: 5s
      interval: 10s
      retries: 3
      start_period: 15s
    environment:
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: supabase_admin
      DB_PASSWORD: ${SUPABASE_DB_PASSWORD}
      DB_NAME: postgres
      DB_AFTER_CONNECT_QUERY: 'SET search_path TO _realtime'
      DB_ENC_KEY: ${SUPABASE_REALTIME_ENC_KEY:-supabaserealtime}
      API_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      SECRET_KEY_BASE: ${SUPABASE_SECRET_KEY_BASE}
      METRICS_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      ERL_AFLAGS: -proto_dist inet_tcp
      DNS_NODES: "''"
      RLIMIT_NOFILE: "10000"
      APP_NAME: realtime
      SEED_SELF_HOST: "true"
      RUN_JANITOR: "true"
      DISABLE_HEALTHCHECK_LOGGING: "true"
    networks:
      Automation:
        aliases:
          - realtime
          - realtime-dev.supabase-realtime

  # ==========================================
  # 20. Supabase Storage API
  # ==========================================
  supabase-storage:
    image: supabase/storage-api:v1.81.0
    container_name: supabase-storage
    restart: unless-stopped
    depends_on:
      supabase-db:
        condition: service_healthy
      supabase-rest:
        condition: service_started
      supabase-imgproxy:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:5000/status"
        ]
      timeout: 5s
      interval: 5s
      retries: 5
      start_period: 15s
    environment:
      ANON_KEY: ${SUPABASE_ANON_KEY}
      SERVICE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      POSTGREST_URL: http://rest:3000
      AUTH_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${SUPABASE_DB_PASSWORD}@db:5432/postgres
      STORAGE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}
      REQUEST_ALLOW_X_FORWARDED_PATH: "true"
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      GLOBAL_S3_BUCKET: supabase-storage
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: stub
      ENABLE_IMAGE_TRANSFORMATION: "true"
      IMGPROXY_URL: http://imgproxy:5001
    volumes:
      - ./data/supabase/storage:/var/lib/storage
    networks:
      Automation:
        aliases:
          - storage

  # ==========================================
  # 21. Supabase Image Proxy
  # ==========================================
  supabase-imgproxy:
    image: darthsim/imgproxy:v3.31.4
    container_name: supabase-imgproxy
    restart: unless-stopped
    volumes:
      - ./data/supabase/storage:/var/lib/storage
    healthcheck:
      test: ["CMD", "imgproxy", "health"]
      timeout: 5s
      interval: 5s
      retries: 3
    environment:
      IMGPROXY_BIND: ":5001"
      IMGPROXY_LOCAL_FILESYSTEM_ROOT: /
      IMGPROXY_USE_ETAG: "true"
      IMGPROXY_AUTO_WEBP: "true"
      IMGPROXY_MAX_SRC_RESOLUTION: 16.8
    networks:
      Automation:
        aliases:
          - imgproxy

  # ==========================================
  # 22. Supabase Postgres Meta API
  # ==========================================
  supabase-meta:
    image: supabase/postgres-meta:v0.100.0
    container_name: supabase-meta
    restart: unless-stopped
    depends_on:
      supabase-db:
        condition: service_healthy
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: ${SUPABASE_DB_PASSWORD}
      CRYPTO_KEY: ${SUPABASE_PG_META_CRYPTO_KEY}
    networks:
      Automation:
        aliases:
          - meta

  # ==========================================
  # 23. Supabase Studio Dashboard UI
  # ==========================================
  supabase-studio:
    image: supabase/studio:2026.10.12-sha-3699278
    container_name: supabase-studio
    restart: unless-stopped
    ports:
      - "54323:3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:3000/api/platform/profile').then((r) => {if (r.status !== 200) throw new Error(r.status)})\""
        ]
      timeout: 10s
      interval: 5s
      retries: 5
      start_period: 20s
    environment:
      HOSTNAME: "0.0.0.0"
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_PORT: 5432
      POSTGRES_HOST: db
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${SUPABASE_DB_PASSWORD}
      POSTGRES_USER_READ_WRITE: postgres
      PG_META_CRYPTO_KEY: ${SUPABASE_PG_META_CRYPTO_KEY}
      PGRST_DB_SCHEMAS: public,storage,graphql_public
      PGRST_DB_MAX_ROWS: 1000
      PGRST_DB_EXTRA_SEARCH_PATH: public
      DEFAULT_ORGANIZATION_NAME: Automation
      DEFAULT_PROJECT_NAME: AutomationHub
      SUPABASE_URL: http://kong:8000
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      AUTH_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      ENABLED_FEATURES_LOGS_ALL: "false"
      SNIPPETS_MANAGEMENT_FOLDER: /app/snippets
    volumes:
      - ./data/supabase/snippets:/app/snippets
    depends_on:
      supabase-meta:
        condition: service_started
      supabase-db:
        condition: service_healthy
    networks:
      Automation:
        aliases:
          - studio

  # ==========================================
  # 24. Supabase Edge Functions Runtime
  # ==========================================
  supabase-edge-functions:
    image: supabase/edge-runtime:v1.77.4
    container_name: supabase-edge-functions
    restart: unless-stopped
    volumes:
      - ./config/supabase/functions:/home/deno/functions:ro
      - supabase-deno-cache:/root/.cache/deno
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/127.0.0.1/9000'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      JWT_SECRET: ${SUPABASE_JWT_SECRET}
      SUPABASE_URL: http://kong:8000
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SUPABASE_DB_URL: postgresql://postgres:${SUPABASE_DB_PASSWORD}@db:5432/postgres
      VERIFY_JWT: "false"
    command:
      [
        "start",
        "--user-worker-request-idle-timeout",
        "150000",
        "--main-service",
        "/home/deno/functions/main"
      ]
    depends_on:
      supabase-db:
        condition: service_healthy
    networks:
      Automation:
        aliases:
          - functions

  # ==========================================
  # 25. OpenWA WhatsApp API Gateway
  # ==========================================
  openwa:
    image: rmyndharis/openwa:latest
    container_name: openwa
    restart: unless-stopped
    stop_grace_period: 75s
    ports:
      - "${OPENWA_PORT:-2785}:2785"
    environment:
      - NODE_ENV=${OPENWA_NODE_ENV:-development}
      - PORT=2785
      - LOG_LEVEL=${OPENWA_LOG_LEVEL:-info}
      - API_MASTER_KEY=${OPENWA_API_KEY:-}
      # Local storage configured to store media and session files under data/openwa
      - STORAGE_TYPE=local
      - STORAGE_LOCAL_PATH=/app/data/media
      # PostgreSQL Database Connection
      - DATABASE_TYPE=postgres
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_NAME=${OPENWA_DB_NAME:-openwa}
      - DATABASE_USERNAME=${POSTGRES_USER}
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD}
      - DATABASE_SYNCHRONIZE=false
      # Redis Integration & Queue
      - REDIS_ENABLED=true
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - QUEUE_ENABLED=true
      # Webhook & Server config
      - WEBHOOK_TIMEOUT=10000
      - WEBHOOK_RETRY_DELAY=5000
      - WEBHOOK_SSRF_PROTECT=false
      - SSRF_ALLOWED_HOSTS=n8n,caddy,n8n.local,localhost,host.docker.internal
      - SERVE_DASHBOARD=true
      - BASE_URL=http://openwa.local
    volumes:
      - ./data/openwa:/app/data
      - ./shared:/data/shared
    networks:
      - Automation
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2785/api/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  sandbox-tls:
  supabase-db-config:
  supabase-deno-cache:
